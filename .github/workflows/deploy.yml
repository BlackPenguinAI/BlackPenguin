name: Deploy Black Penguin API to DigitalOcean

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'                    # 🚀 MAGIA MONOREPO: Solo se ejecuta si cambias el backend
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🚀 Conectando al Droplet y Desplegando
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DO_HOST }}
        username: ${{ secrets.DO_USER }}
        key: ${{ secrets.DO_SSH_KEY }}
        script: |
          cd /home/jorge/BlackPenguin
          git pull origin main
          
          # 1. Borramos el .env viejo y creamos uno nuevo inyectando secretos
          echo "Creando archivo .env de producción..."
          rm -f backend/.env
          echo "ENVIRONMENT=production" >> backend/.env
          echo "DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}" >> backend/.env
          echo "META_ACCESS_TOKEN=${{ secrets.PROD_META_TOKEN }}" >> backend/.env
          echo "OPENROUTER_API_KEY=${{ secrets.PROD_OPENROUTER_KEY }}" >> backend/.env
          # ... (agregas todas tus variables aquí)
          
          # 2. Construimos y corremos Docker
          docker build -t blackpenguin-api:latest ./backend
          docker stop bp_api_prod || true
          docker rm bp_api_prod || true
          
          # Docker leerá el .env recién fabricado
          docker run -d --name bp_api_prod -p 80:8000 --env-file ./backend/.env blackpenguin-api:latest