name: Deploy Black Penguin API to DigitalOcean

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'                    # 🚀 MAGIA MONOREPO: Solo se ejecuta si cambias el backend
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🚀 Conectando al Droplet y Desplegando
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DO_HOST }}
        username: ${{ secrets.DO_USER }}
        key: ${{ secrets.DO_SSH_KEY }}
        script: |
          # 1. Navegamos a la nueva carpeta del monorepo
          cd /home/jorge/BlackPenguin
          
          # 2. Descargamos tu código más nuevo de GitHub
          git pull origin main
          
          # 3. Construimos la nueva imagen de Docker apuntando a la carpeta backend
          echo "🏗️ Construyendo imagen de FastAPI..."
          docker build -t blackpenguin-api:latest ./backend
          
          # 4. Detenemos y borramos la versión vieja de la API
          echo "🛑 Reemplazando contenedor antiguo..."
          docker stop bp_api_prod || true
          docker rm bp_api_prod || true
          
          # 5. Encendemos el nuevo motor asegurando la ruta correcta del .env
          echo "🚀 Iniciando la nueva API..."
          docker run -d \
            --name bp_api_prod \
            -p 80:8000 \
            --env-file ./backend/.env \
            blackpenguin-api:latest