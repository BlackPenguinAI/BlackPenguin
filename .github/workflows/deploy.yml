name: Deploy Black Penguin API to DigitalOcean

# Esto le dice a GitHub que se ejecute SOLO cuando subas cambios a la rama "main"
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🚀 Conectando al Droplet y Desplegando
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DO_HOST }}
        username: ${{ secrets.DO_USER }}
        key: ${{ secrets.DO_SSH_KEY }}
        # Este script se ejecuta directamente adentro de tu consola de DigitalOcean
        script: |
          # 1. Navegamos a la carpeta REAL de tu proyecto
          cd /home/jorge/BlackPenguinBackend
          
          # 2. Descargamos tu código más nuevo de GitHub
          git pull origin main
          
          # 3. Construimos la nueva imagen de Docker con tus cambios
          echo "🏗️ Construyendo imagen de FastAPI..."
          docker build -t blackpenguin/core-api:latest .
          
          # 4. FORZAMOS a K3s a reiniciar los contenedores para absorber la nueva imagen
          echo "🚢 Reiniciando pods en K3s (Zero-Downtime)..."
          kubectl rollout restart deployment/bp-backend-deployment --namespace=staging
          
          # 5. Esperamos a que todo esté en verde
          kubectl rollout status deployment/bp-backend-deployment --namespace=staging
          echo "🎉 ¡Despliegue exitoso!"