name: Deploy Firebase Admin Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'firebase-admin-bridge/**'
      - '.github/workflows/deploy-firebase-admin-bridge.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-admin-bridge-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configure Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy bridge to Cloud Run
        run: |
          set -Eeuo pipefail
          gcloud run deploy blackpenguin-firebase-admin \
            --source=./firebase-admin-bridge \
            --project=blackpenguinai \
            --region=us-central1 \
            --service-account=blackpenguin-firebase-admin@blackpenguinai.iam.gserviceaccount.com \
            --set-env-vars=FIREBASE_PROJECT_ID=blackpenguinai,FIRESTORE_MAIL_COLLECTION=mail \
            --set-secrets=BRIDGE_SHARED_SECRET=blackpenguin-firebase-admin-bridge-secret:latest \
            --allow-unauthenticated \
            --quiet

      - name: Verify bridge health
        run: |
          set -Eeuo pipefail
          BRIDGE_DEPLOY_URL="$(
            gcloud run services describe blackpenguin-firebase-admin \
              --project=blackpenguinai \
              --region=us-central1 \
              --format='value(status.url)'
          )"
          test -n "$BRIDGE_DEPLOY_URL"
          HEALTH_RESPONSE="$(curl --fail --silent --show-error "${BRIDGE_DEPLOY_URL}/health")"
          python3 -c \
            'import json,sys; data=json.loads(sys.argv[1]); assert data == {"status":"ok","mail_collection":"mail"}' \
            "$HEALTH_RESPONSE"
