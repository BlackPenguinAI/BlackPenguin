name: Hermes HEI-06A.2 persistent staging foundation
on:
  workflow_dispatch:
    inputs:
      run_scoped:
        description: "Run HEI-06A.2b.1 scoped simulation authorization after foundation"
        type: boolean
        default: false
      run_live_worker:
        description: "Run HEI-06A.2b.2 scoped real inbound worker acceptance (simulated providers)"
        type: boolean
        default: false
      run_openrouter:
        description: "Run real SDK (requires run_scoped or run_live_worker)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hei06a2-foundation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  persistent-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm certified production baseline and local guard tests
        shell: bash
        run: |
          set -euo pipefail
          base=a61178b09f1856d42a6698fd3f0eddf8e4ae0ab6
          test "${{ inputs.run_openrouter }}" != true || test "${{ inputs.run_scoped }}" = true || test "${{ inputs.run_live_worker }}" = true
          git merge-base --is-ancestor "$base" "$GITHUB_SHA"
          if test "${{ inputs.run_scoped }}" = true; then
            git merge-base --is-ancestor 0eb7da1e8c675126f77ef94ddefa561cd2686246 "$GITHUB_SHA"
          fi
          if test "${{ inputs.run_live_worker }}" = true; then
            git merge-base --is-ancestor 38affaa86c36bb60e13eaa99a670bfdc70ff827b "$GITHUB_SHA"
          fi
          python3 - "$base" "$GITHUB_SHA" <<'PY'
          import subprocess, sys
          paths=subprocess.check_output(['git','diff','--name-only','-z',sys.argv[1],sys.argv[2]]).decode().split('\0')
          allowed={'.github/workflows/hermes-hei06a2-persistent-staging.yml','docs/hermes-integration/HEI_06A2_PERSISTENT_STAGING_FOUNDATION.md'}
          assert all(not p or p in allowed or p.startswith('services/hermes_worker/persistent_staging/') for p in paths), 'Production baseline differs; recertify before extending staging'
          PY
          test "$(git hash-object backend/app/modules/hermes_sales_core/engine_selection.py)" = 26f3d1e46f45f8e945f98d7f8b7209ca4df51e00
          if test "${{ inputs.run_live_worker }}" = true; then
            test "$(git hash-object backend/app/modules/sales_agent/engine_router.py)" = 25820acf3ee622ef25fcd46962299d3b7f63d015
            test "$(git hash-object backend/app/modules/sales_agent/live_worker.py)" = b6ec484d1d809839e9696c053cca47f4b99f76a1
            test "$(git hash-object backend/app/modules/sales_agent/live_service.py)" = 528cbafd60363d22afdcca3ecd620df62cc05c3e
            test "$(git hash-object backend/app/modules/hermes_sales_core/live_job.py)" = 0289bf6005cce157260f0d582885b0da17e14413
            test "$(git hash-object backend/app/modules/hermes_sales_core/sdk_service.py)" = a61b24af44dc0dd34d72af4d2f03338f16f0b583
          fi
          python3 -m unittest discover -s services/hermes_worker/persistent_staging -p 'test_*.py' -v
      - name: Start independent persistent topology
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hei06a2-evidence"
          python3 services/hermes_worker/persistent_staging/manage.py init "$RUNNER_TEMP/hei06a2-state"
          python3 services/hermes_worker/persistent_staging/manage.py up "$RUNNER_TEMP/hei06a2-state"
      - name: Real API, private SDK closed gate, publication and isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 services/hermes_worker/persistent_staging/manage.py probe "$RUNNER_TEMP/hei06a2-state" | tee "$RUNNER_TEMP/hei06a2-evidence/initial.json"
          curl -fsS --max-time 10 http://127.0.0.1:18082/api/v1/health/ready >/dev/null
      - name: Recreate containers without deleting volume
        shell: bash
        run: |
          set -euo pipefail
          tool=services/hermes_worker/persistent_staging/manage.py
          state="$RUNNER_TEMP/hei06a2-state"
          python3 "$tool" down "$state"
          python3 "$tool" up "$state"
          policy=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["policy_id"])' "$RUNNER_TEMP/hei06a2-evidence/initial.json")
          python3 "$tool" probe "$state" --expected-policy "$policy" | tee "$RUNNER_TEMP/hei06a2-evidence/recreated.json"
      - name: HEI-06A.2b.1 scoped authorization and in-app receipts
        if: inputs.run_scoped
        shell: bash
        env:
          HEI06A2_SCOPED_OPENROUTER_API_KEY: ${{ inputs.run_openrouter && secrets.HEI06_OPENROUTER_API_KEY || '' }}
        run: |
          set -euo pipefail
          args=()
          if test "${{ inputs.run_openrouter }}" = true; then
            test -n "$HEI06A2_SCOPED_OPENROUTER_API_KEY"
            args+=(--model)
          fi
          python3 services/hermes_worker/persistent_staging/scoped_acceptance.py "$RUNNER_TEMP/hei06a2-state" "${args[@]}" | tee "$RUNNER_TEMP/hei06a2-evidence/scoped.json"
      - name: HEI-06A.2b.2 actual inbound worker, private SDK and simulated transport
        if: inputs.run_live_worker
        shell: bash
        env:
          HEI06A2_LIVE_OPENROUTER_API_KEY: ${{ inputs.run_openrouter && secrets.HEI06_OPENROUTER_API_KEY || '' }}
        run: |
          set -euo pipefail
          args=()
          if test "${{ inputs.run_openrouter }}" = true; then
            test -n "$HEI06A2_LIVE_OPENROUTER_API_KEY"
            args+=(--model)
          fi
          python3 services/hermes_worker/persistent_staging/live_scope_acceptance.py "$RUNNER_TEMP/hei06a2-state" "${args[@]}" | tee "$RUNNER_TEMP/hei06a2-evidence/live-worker.json"
      - name: Confirm persistence and clean hosted CI only
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/hei06a2-evidence" <<'PY'
          import json, pathlib, sys
          d=pathlib.Path(sys.argv[1]); a=json.loads((d/'initial.json').read_text()); b=json.loads((d/'recreated.json').read_text())
          assert a['status']==b['status']=='PASS' and a['policy_id']==b['policy_id'] and a['candidate_commit']==b['candidate_commit']
          assert all(a['checks'].values()) and all(b['checks'].values())
          PY
          python3 services/hermes_worker/persistent_staging/manage.py ci-clean "$RUNNER_TEMP/hei06a2-state"
          python3 - "$RUNNER_TEMP/hei06a2-evidence" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1]); a=json.loads((p/'initial.json').read_text())
          scoped=json.loads((p/'scoped.json').read_text()) if (p/'scoped.json').exists() else {}
          assert not scoped or scoped['status']=='PASS'
          live=json.loads((p/'live-worker.json').read_text()) if (p/'live-worker.json').exists() else {}
          assert not live or (live['status']=='PASS' and live['one_shot_live_worker']=='PASS' and all(live['checks'].values()))
          (p/'summary.json').write_text(json.dumps({'status':'PASS','candidate_commit':a['candidate_commit'],'published_policy_preserved':True,'scoped_simulation_authorization':scoped.get('status','NOT_RUN'),'real_inference':scoped.get('real_inference','NOT_RUN'),'scoped_one_shot_live_worker':live.get('one_shot_live_worker','NOT_RUN'),'live_worker_real_inference':live.get('real_inference','NOT_RUN'),'continuous_api_worker_authorization':'NOT_RUN','live_staging_authorization':'NOT_RUN','real_provider_acceptance':'NOT_RUN','production_readiness':'CLOSED'},indent=2)+'\n')
          PY
      - name: Capture sanitized startup evidence before cleanup
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hei06a2-evidence"
          if test -f "$RUNNER_TEMP/hei06a2-state/staging.env"; then
            python3 services/hermes_worker/persistent_staging/manage.py diagnostics "$RUNNER_TEMP/hei06a2-state" | tee "$RUNNER_TEMP/hei06a2-evidence/startup-failure.json"
          fi
      - name: Cleanup if interrupted
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/hei06a2-state/staging.env"; then
            python3 services/hermes_worker/persistent_staging/manage.py ci-clean "$RUNNER_TEMP/hei06a2-state"
          fi
      - name: Retain sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hei06a2-foundation-${{ github.sha }}
          path: ${{ runner.temp }}/hei06a2-evidence/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Report exact scope
        if: always()
        run: |
          echo '## HEI-06A.2 — closed persistent foundation' >> "$GITHUB_STEP_SUMMARY"
          echo '- Continuous API worker authorization and external providers: NOT_RUN.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Scoped simulation requested: ${{ inputs.run_scoped }}; real OpenRouter requested: ${{ inputs.run_openrouter }}.' >> "$GITHUB_STEP_SUMMARY"
          if test -f "$RUNNER_TEMP/hei06a2-evidence/scoped.json"; then
            python3 - "$RUNNER_TEMP/hei06a2-evidence/scoped.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,sys
          r=json.load(open(sys.argv[1])); print('- Scoped simulation: '+r['status']+'; real inference: '+r['real_inference'])
          PY
          fi
          echo '- Scoped live worker requested: ${{ inputs.run_live_worker }}.' >> "$GITHUB_STEP_SUMMARY"
          if test -f "$RUNNER_TEMP/hei06a2-evidence/live-worker.json"; then
            python3 - "$RUNNER_TEMP/hei06a2-evidence/live-worker.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,sys
          r=json.load(open(sys.argv[1])); print('- Scoped one-shot live worker: '+r['status']+'; real inference: '+r['real_inference'])
          PY
          fi
          echo '- Production readiness: CLOSED.' >> "$GITHUB_STEP_SUMMARY"
