<div class="min-h-screen bg-black text-white font-sans p-6 md:p-12 relative overflow-hidden">
  <div class="absolute bottom-0 left-0 w-96 h-96 bg-secondary/5 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="max-w-5xl mx-auto relative z-10">
    <div class="mb-8 border-b border-white/10 pb-6">
      <h1 class="text-3xl font-light tracking-tight">Specialized <span class="text-secondary font-medium">Agents</span></h1>
      <p class="text-sm text-gray-400 mt-1">Sintoniza los protocolos, comportamientos y restricciones de los agentes de Inteligencia Artificial.</p>
    </div>

    <div *ngIf="isLoading" class="flex justify-center py-24">
      <div class="animate-spin h-8 w-8 border-2 border-secondary border-t-transparent rounded-full"></div>
    </div>

    <form *ngIf="!isLoading" (ngSubmit)="saveSettings()">
      <app-glass-card paddingClass="p-6 md:p-8">
        
        <div class="flex flex-wrap gap-2 border-b border-white/10 pb-5 mb-6">
          <button type="button" (click)="setTab('empresa')" 
                  [class]="activeTab === 'empresa' ? 'bg-secondary text-black hover:bg-yellow-500' : 'bg-white/5 text-gray-400 border hover:border-secondary'" 
                  class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all border-white/5">
            Onboarding Empresa
          </button>
          <button type="button" (click)="setTab('proyectos')" 
                  [class]="activeTab === 'proyectos' ? 'bg-secondary text-black hover:bg-yellow-500' : 'bg-white/5 text-gray-400 border hover:border-secondary'" 
                  class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all border-white/5">
            Onboarding Proyectos
          </button>
          <button type="button" (click)="setTab('ventas')" 
                  [class]="activeTab === 'ventas' ? 'bg-secondary text-black hover:bg-yellow-500' : 'bg-white/5 text-gray-400 border hover:border-secondary'" 
                  class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all border-white/5">
            Agente de Ventas
          </button>
          <button type="button" (click)="setTab('reporteria')" 
                  [class]="activeTab === 'reporteria' ? 'bg-secondary text-black hover:bg-yellow-500' : 'bg-white/5 text-gray-400 border hover:border-secondary'" 
                  class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all border-white/5">
            Reportería
          </button>
        </div>

        <div class="flex flex-col gap-6 animate-fade-in">
          
          <div class="w-full md:w-1/2">
            <app-select label="Modelo de Lenguaje" [options]="modelOptions" [(ngModel)]="activeAgent.model" name="modelSelect"></app-select>
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-secondary uppercase tracking-wider flex items-center gap-2"><span>●</span> System Prompt (Identidad)</label>
            <textarea rows="4" name="sysPrompt" [(ngModel)]="activeAgent.system_prompt" placeholder="Ej: Eres un especialista corporativo..." class="bg-black/50 border border-white/10 focus:border-secondary rounded-xl p-4 text-sm text-white focus:outline-none font-mono resize-y leading-relaxed"></textarea>
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-secondary uppercase tracking-wider flex items-center gap-2"><span>●</span> Flow & Protocol (Pasos)</label>
            <textarea rows="6" name="protPrompt" [(ngModel)]="activeAgent.protocol_prompt" placeholder="1. Pide el nombre... 2. Evalúa..." class="bg-black/50 border border-white/10 focus:border-secondary rounded-xl p-4 text-sm text-white focus:outline-none font-mono resize-y leading-relaxed"></textarea>
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-secondary uppercase tracking-wider flex items-center gap-2"><span>●</span> Guardrails (Restricciones)</label>
            <textarea rows="4" name="guardPrompt" [(ngModel)]="activeAgent.guardrails_prompt" placeholder="Ej: Nunca respondas fuera del contexto..." class="bg-black/50 border border-white/10 focus:border-secondary rounded-xl p-4 text-sm text-white focus:outline-none font-mono resize-y leading-relaxed"></textarea>
          </div>
        </div>

        <div class="flex justify-end border-t border-white/10 pt-6 mt-6">
          <app-button type="submit" variant="primary" [isLoading]="isSaving">
            Guardar Configuración
          </app-button>
        </div>
      </app-glass-card>
    </form>

  </div>
</div>
