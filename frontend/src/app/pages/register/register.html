<div class="fixed inset-0 z-0 pointer-events-none">
  <video #bgVideo [muted]="true" [autoplay]="true" [loop]="true" playsinline class="w-full h-full object-cover brightness-60">
    <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260403_050628_c4e32401-fab4-4a27-b7a8-6e9291cd5959.mp4" type="video/mp4">
  </video>
</div>

<div class="fixed top-6 right-6 z-50 bg-surface-level-1/40 backdrop-blur-md border border-white/10 px-4 py-2 rounded-full flex items-center gap-2">
  <button (click)="switchLanguage('en')" [class.text-secondary]="currentLang === 'en'" class="text-xs font-bold text-gray-custom hover:text-white transition-colors">EN</button>
  <span class="text-gray-custom text-xs">/</span>
  <button (click)="switchLanguage('es')" [class.text-secondary]="currentLang === 'es'" class="text-xs font-bold text-gray-custom hover:text-white transition-colors">ES</button>
</div>

<div class="min-h-screen flex items-center justify-center p-4 relative z-10 select-none">
  
  <div class="liquid-glass w-full max-w-md p-8 md:p-10 flex flex-col gap-6 shadow-2xl relative">
    
    <button routerLink="/" class="absolute top-4 left-4 text-gray-custom hover:text-white transition-colors flex items-center gap-1 text-xs focus:outline-none">
      <span class="material-symbols-outlined text-sm">arrow_back</span>
    </button>

    <div class="text-center flex flex-col items-center gap-2 mt-2">
      <img alt="Black Penguin Logo" class="h-10 w-10 object-contain cursor-pointer transition-transform hover:scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxl2QxLaz1QVZlAWP1ksa3Vsw8hnGkq7DN9pIFoivY_s0ANfwB6_2SUVcF-XuzZxv_QkfH-yYy0Zc1TjmtQ9hP1gQTJB2TYxp1DFMuGtCSL7fddgkgG8ENFAvecOdZ0uABF1CY5yR7_VUrse9PALCGMFUALu0wLsTml1PYbq2FbNq3FTatmSUOjSFUiuhDInqKQifEP-apKuFd0djcZrYKCm-40vcNvQSEutAVuANBR8keQgsajYWdrcIrDHDKew0a7QkZVGOKBUM" routerLink="/">
      <h2 class="text-2xl font-medium text-white tracking-tight mt-2">{{ 'AUTH.CREATE_ACCOUNT' | translate }}</h2>
      <p class="text-xs text-gray-custom leading-relaxed">{{ 'AUTH.SUBTITLE_REGISTER' | translate }}</p>
    </div>

    <form (ngSubmit)="handleRegister()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-gray-custom px-1">{{ 'AUTH.FULL_NAME' | translate }}</label>
        <input 
          [(ngModel)]="form.fullName" name="fullName" type="text" required
          class="w-full bg-surface-level-1/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-secondary focus:ring-0 transition-colors">
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-gray-custom px-1">{{ 'AUTH.EMAIL' | translate }}</label>
        <input 
          [(ngModel)]="form.email" name="email" type="email" required
          class="w-full bg-surface-level-1/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-secondary focus:ring-0 transition-colors">
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-gray-custom px-1">{{ 'AUTH.PASSWORD' | translate }}</label>
        <input 
          [(ngModel)]="form.password" name="password" type="password" required
          class="w-full bg-surface-level-1/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-secondary focus:ring-0 transition-colors">
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-gray-custom px-1">{{ 'AUTH.CONFIRM_PASSWORD' | translate }}</label>
        <input 
          [(ngModel)]="form.confirmPassword" name="confirmPassword" type="password" required
          class="w-full bg-surface-level-1/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-secondary focus:ring-0 transition-colors">
        
        <span *ngIf="form.password && form.confirmPassword && form.password !== form.confirmPassword" class="text-[10px] text-red-400 mt-1 px-1">
          {{ 'AUTH.ERROR_MATCH' | translate }}
        </span>
      </div>

      <button 
        [disabled]="isSubmitting || !form.email || !form.password || form.password !== form.confirmPassword"
        type="submit" 
        class="w-full bg-white text-black font-medium py-3 rounded-full mt-4 flex items-center justify-center gap-2 transition-all active:scale-[0.98] hover:bg-secondary hover:text-white disabled:opacity-40">
        <span *ngIf="isSubmitting" class="material-symbols-outlined animate-spin text-sm">sync</span>
        {{ 'AUTH.SIGN_UP' | translate }}
      </button>
    </form>

    <p class="text-xs text-center text-gray-custom">
      {{ 'AUTH.ALREADY_HAVE_ACCOUNT' | translate }} 
      <a routerLink="/login" class="text-secondary font-medium hover:underline cursor-pointer">{{ 'AUTH.LOGIN_NOW' | translate }}</a>
    </p>

  </div>
</div>
