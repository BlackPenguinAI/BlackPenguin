<div class="min-h-screen bg-black text-white font-sans flex flex-col justify-center items-center p-4 relative overflow-hidden">
  <div class="absolute top-1/4 right-1/4 w-96 h-96 bg-secondary/10 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="w-full max-w-md liquid-glass border border-white/10 rounded-3xl p-8 relative z-10 shadow-2xl">
    
    <div class="text-center mb-8">
      <div class="flex items-center justify-center gap-2 mb-4">
        <span class="text-2xl font-semibold text-white tracking-tight">Black</span>
        <span class="text-2xl font-light text-secondary tracking-tight">Penguin</span>
      </div>
      <h2 class="text-xl font-light tracking-tight mt-6">Activación de Cuenta</h2>
      <p class="text-sm text-gray-400 mt-2">Establece tu contraseña de acceso para continuar.</p>
    </div>

    <form (ngSubmit)="submitPassword()" class="flex flex-col gap-5">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs text-gray-400 uppercase tracking-widest">Nueva Contraseña</label>
        <input type="password" [(ngModel)]="form.new_password" name="newPass" required class="bg-black/50 border border-white/10 focus:border-secondary rounded-xl px-4 py-3 text-sm text-white outline-none transition-colors">
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs text-gray-400 uppercase tracking-widest">Confirmar Contraseña</label>
        <input type="password" [(ngModel)]="form.confirm_password" name="confPass" required class="bg-black/50 border border-white/10 focus:border-secondary rounded-xl px-4 py-3 text-sm text-white outline-none transition-colors">
      </div>

      <button type="submit" [disabled]="isLoading || !form.new_password || !form.confirm_password" class="w-full mt-4 bg-secondary text-black font-bold py-3 rounded-xl hover:bg-yellow-500 transition-colors flex items-center justify-center gap-2 disabled:opacity-50">
        <span *ngIf="isLoading" class="material-symbols-outlined animate-spin text-sm">sync</span>
        Guardar e Ingresar
      </button>
    </form>
  </div>
</div>
