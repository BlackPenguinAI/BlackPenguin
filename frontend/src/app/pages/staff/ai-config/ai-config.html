<div class="min-h-screen bg-black text-white font-sans p-6 md:p-12 relative overflow-hidden">
  <div class="absolute bottom-0 left-0 w-96 h-96 bg-secondary/5 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="max-w-5xl mx-auto relative z-10">
    <div class="mb-8">
      <h1 class="text-3xl font-light tracking-tight">Specialized <span class="text-secondary font-medium">Agents</span></h1>
      <p class="text-sm text-gray-400 mt-1">Sintoniza los protocolos, comportamientos y restricciones de los agentes de Inteligencia Artificial.</p>
    </div>

    <form (ngSubmit)="onSave()" class="liquid-glass border border-white/5 p-8 rounded-2xl flex flex-col shadow-2xl">
      
      <div class="flex flex-wrap gap-2 border-b border-white/10 pb-5 mb-6">
        <button type="button" (click)="setTab('empresa')" 
                [class.bg-secondary]="activeTab === 'empresa'" [class.text-black]="activeTab === 'empresa'" 
                [class.bg-white_5]="activeTab !== 'empresa'" [class.text-gray-400]="activeTab !== 'empresa'" 
                class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all border border-white/5 hover:border-secondary">
          Onboarding Empresa
        </button>

        <button type="button" (click)="setTab('proyectos')" 
                [class.bg-secondary]="activeTab === 'proyectos'" [class.text-black]="activeTab === 'proyectos'" 
                [class.bg-white_5]="activeTab !== 'proyectos'" [class.text-gray-400]="activeTab !== 'proyectos'" 
                class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all border border-white/5 hover:border-secondary">
          Onboarding Proyectos
        </button>

        <button type="button" (click)="setTab('ventas')" 
                [class.bg-secondary]="activeTab === 'ventas'" [class.text-black]="activeTab === 'ventas'" 
                [class.bg-white_5]="activeTab !== 'ventas'" [class.text-gray-400]="activeTab !== 'ventas'" 
                class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all border border-white/5 hover:border-secondary">
          Ventas (Copiloto)
        </button>

        <button type="button" (click)="setTab('reporteria')" 
                [class.bg-secondary]="activeTab === 'reporteria'" [class.text-black]="activeTab === 'reporteria'" 
                [class.bg-white_5]="activeTab !== 'reporteria'" [class.text-gray-400]="activeTab !== 'reporteria'" 
                class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all border border-white/5 hover:border-secondary">
          Reportería (Analista)
        </button>
      </div>

      <div class="flex flex-col gap-6">
        
        <div class="max-w-sm">
          <app-select label="Modelo Base de IA" [options]="modelOptions" [(ngModel)]="activeAgent.model" name="activeModel"></app-select>
        </div>

        <div class="grid grid-cols-1 gap-6">
          <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-secondary uppercase tracking-wider flex items-center gap-2"><span>●</span> System Identity (Rol)</label>
            <textarea rows="5" name="sysPrompt" [(ngModel)]="activeAgent.system_prompt" placeholder="Ej: Eres el asistente principal de la plataforma..." class="bg-black/50 border border-white/10 focus:border-secondary rounded-xl p-4 text-sm text-white focus:outline-none font-mono resize-y leading-relaxed"></textarea>
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-secondary uppercase tracking-wider flex items-center gap-2"><span>●</span> Protocol Flow (Atención)</label>
            <textarea rows="5" name="protoPrompt" [(ngModel)]="activeAgent.protocol_prompt" placeholder="Ej: Sigue esta secuencia: 1. Saluda, 2. Pregunta el nombre de la empresa..." class="bg-black/50 border border-white/10 focus:border-secondary rounded-xl p-4 text-sm text-white focus:outline-none font-mono resize-y leading-relaxed"></textarea>
          </div>

          <div class="flex flex-col gap-2 mb-4">
            <label class="text-sm font-medium text-secondary uppercase tracking-wider flex items-center gap-2"><span>●</span> Guardrails (Restricciones)</label>
            <textarea rows="5" name="guardPrompt" [(ngModel)]="activeAgent.guardrails_prompt" placeholder="Ej: Nunca respondas preguntas fuera del contexto inmobiliario..." class="bg-black/50 border border-white/10 focus:border-secondary rounded-xl p-4 text-sm text-white focus:outline-none font-mono resize-y leading-relaxed"></textarea>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between border-t border-white/10 pt-6 mt-4">
        <p *ngIf="statusMessage" [class.text-green-400]="!isError" [class.text-red-500]="isError" class="text-sm font-medium animate-fade-in flex items-center gap-2">
          <span class="material-symbols-outlined text-[18px]">{{ isError ? 'error' : 'check_circle' }}</span>
          {{ statusMessage }}
        </p>
        <div *ngIf="!statusMessage"></div>

        <button type="submit" [disabled]="isSaving" class="px-8 py-3 bg-white text-black font-semibold text-sm rounded-xl hover:bg-secondary transition-all duration-300 disabled:opacity-40 flex items-center gap-2 shadow-lg">
          <span *ngIf="isSaving" class="material-symbols-outlined animate-spin text-[18px]">sync</span>
          Guardar Protocolos
        </button>
      </div>

    </form>
  </div>
</div>
