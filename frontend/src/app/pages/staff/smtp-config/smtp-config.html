<div class="min-h-screen bg-black text-white font-sans p-6 md:p-12 relative overflow-hidden">
  <div class="absolute top-0 right-0 w-96 h-96 bg-blue-600/10 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="max-w-3xl mx-auto relative z-10">
    <div class="mb-8">
      <h1 class="text-3xl font-light tracking-tight">SMTP <span class="text-blue-500 font-medium">Configuration</span></h1>
      <p class="text-sm text-gray-400 mt-1">Configura el servidor de salida para correos de notificaciones, leads y accesos.</p>
    </div>

    <form (ngSubmit)="onSave()" class="bg-white/5 border border-white/10 p-8 rounded-2xl flex flex-col shadow-2xl backdrop-blur-md">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div class="flex flex-col gap-2">
          <label class="text-xs font-medium text-gray-400 uppercase tracking-wider">SMTP Host</label>
          <input type="text" name="host" [(ngModel)]="config.smtp_host" placeholder="ej. smtp.gmail.com" class="bg-black/50 border border-white/10 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none transition-colors">
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-xs font-medium text-gray-400 uppercase tracking-wider">Puerto</label>
          <input type="number" name="port" [(ngModel)]="config.smtp_port" placeholder="587" class="bg-black/50 border border-white/10 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none transition-colors">
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-xs font-medium text-gray-400 uppercase tracking-wider">Usuario / Email</label>
          <input type="text" name="user" [(ngModel)]="config.smtp_user" placeholder="tu-correo@empresa.com" class="bg-black/50 border border-white/10 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none transition-colors">
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-xs font-medium text-gray-400 uppercase tracking-wider">Contraseña (App Password)</label>
          <input type="password" name="password" [(ngModel)]="config.smtp_password" placeholder="••••••••••••" class="bg-black/50 border border-white/10 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none transition-colors">
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-xs font-medium text-gray-400 uppercase tracking-wider">Seguridad</label>
          <select name="security" [(ngModel)]="config.smtp_security" class="bg-black/50 border border-white/10 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none transition-colors appearance-none">
            <option value="TLS">TLS (Recomendado - Puerto 587)</option>
            <option value="SSL">SSL (Puerto 465)</option>
            <option value="NONE">Ninguna</option>
          </select>
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-xs font-medium text-gray-400 uppercase tracking-wider">Email Remitente (From)</label>
          <input type="text" name="sender" [(ngModel)]="config.sender_email" placeholder="no-reply@blackpenguin.ai" class="bg-black/50 border border-white/10 focus:border-blue-500 rounded-xl p-3 text-sm text-white focus:outline-none transition-colors">
        </div>
      </div>

      <div class="flex items-center justify-between border-t border-white/10 pt-6 mt-2">
        <p *ngIf="statusMessage" [class.text-green-400]="!isError" [class.text-red-500]="isError" class="text-sm font-medium flex items-center gap-2">
          {{ statusMessage }}
        </p>
        <div *ngIf="!statusMessage"></div>

        <button type="submit" [disabled]="isSaving" class="px-8 py-3 bg-white text-black font-semibold text-sm rounded-xl hover:bg-blue-50 transition-all disabled:opacity-50 flex items-center gap-2">
          <span *ngIf="isSaving" class="animate-spin text-lg">↻</span>
          {{ isSaving ? 'Guardando...' : 'Guardar Configuración' }}
        </button>
      </div>
    </form>
  </div>
</div>
