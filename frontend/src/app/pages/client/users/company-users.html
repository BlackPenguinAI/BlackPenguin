<section class="p-8 max-w-7xl mx-auto space-y-8">
  <header>
    <p class="text-xs uppercase tracking-[0.25em] text-secondary">Company access</p>
    <h1 class="text-3xl font-semibold mt-2">Users</h1>
    <p class="text-gray-400 mt-2">Invite administrators, Marketing and Sales users. Active seats follow the Company plan.</p>
  </header>

  <form (ngSubmit)="sendInvite()" class="grid md:grid-cols-5 gap-3 rounded-2xl border border-white/10 bg-white/[0.03] p-5">
    <input name="first_name" [(ngModel)]="invite.first_name" required placeholder="First name" class="bg-black border border-white/10 rounded-lg px-3 py-2">
    <input name="last_name" [(ngModel)]="invite.last_name" required placeholder="Last name" class="bg-black border border-white/10 rounded-lg px-3 py-2">
    <input name="email" [(ngModel)]="invite.email" required type="email" placeholder="Email" class="bg-black border border-white/10 rounded-lg px-3 py-2">
    <select name="role" [(ngModel)]="invite.role" class="bg-black border border-white/10 rounded-lg px-3 py-2">
      <option value="admin">Admin</option><option value="mkt">Marketing</option><option value="sales">Sales</option>
    </select>
    <button [disabled]="saving" class="rounded-lg bg-secondary text-black font-semibold px-4 py-2 disabled:opacity-50">{{ saving ? 'Creating…' : 'Invite user' }}</button>
  </form>

  <div class="rounded-2xl border border-white/10 overflow-hidden">
    <div *ngIf="loading" class="p-8 text-gray-400">Loading users…</div>
    <table *ngIf="!loading" class="w-full text-left">
      <thead class="bg-white/5 text-xs uppercase tracking-wider text-gray-400"><tr><th class="p-4">User</th><th class="p-4">Role</th><th class="p-4">Status</th><th class="p-4 text-right">Action</th></tr></thead>
      <tbody><tr *ngFor="let user of users" class="border-t border-white/10">
        <td class="p-4"><div>{{ user.first_name }} {{ user.last_name }}</div><div class="text-sm text-gray-500">{{ user.email }}</div></td>
        <td class="p-4 uppercase text-sm">{{ user.role }}</td>
        <td class="p-4"><span [class.text-emerald-400]="user.is_active" [class.text-gray-500]="!user.is_active">{{ user.is_active ? 'Active' : 'Inactive' }}</span></td>
        <td class="p-4 text-right"><button (click)="setActive(user, !user.is_active)" class="text-sm text-secondary hover:text-secondary/80">{{ user.is_active ? 'Deactivate' : 'Activate' }}</button></td>
      </tr></tbody>
    </table>
  </div>
</section>
