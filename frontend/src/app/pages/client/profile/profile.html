<div class="flex-1 h-full w-full bg-[#050505] text-white overflow-y-auto p-4 md:p-8 relative">

  <div class="absolute top-0 left-0 w-[400px] h-[400px] bg-blue-500/10 rounded-full blur-[150px] pointer-events-none z-0"></div>

  <div class="relative z-10 mb-8">
    <h1 class="text-2xl md:text-3xl font-light tracking-tight">My <span class="font-medium text-blue-400">Profile</span></h1>
    <p class="text-sm text-gray-400 mt-2">Manage your personal settings and account security.</p>
  </div>

  <div class="max-w-3xl relative z-10 space-y-6">
    
    <div class="bg-white/5 border border-white/10 rounded-2xl p-6 shadow-lg">
      <h2 class="text-sm font-bold uppercase tracking-widest text-white mb-6 flex items-center gap-2">
        <span class="material-symbols-outlined text-gray-400">account_circle</span>
        Account Information
      </h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-1">
          <label class="text-[10px] uppercase tracking-widest text-gray-500 font-bold">Email Address</label>
          <div class="w-full bg-black/50 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-gray-300">
            {{ userEmail || 'Loading...' }}
          </div>
        </div>

        <div class="space-y-1">
          <label class="text-[10px] uppercase tracking-widest text-gray-500 font-bold">Role</label>
          <div class="w-full bg-black/50 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-blue-400 font-medium">
            Tenant Admin
          </div>
        </div>
      </div>
    </div>

    <div class="bg-white/5 border border-white/10 rounded-2xl p-6 shadow-lg opacity-60">
      <h2 class="text-sm font-bold uppercase tracking-widest text-white mb-6 flex items-center gap-2">
        <span class="material-symbols-outlined text-gray-400">lock</span>
        Security Settings
      </h2>
      <p class="text-sm text-gray-400 mb-4">Password management will be available shortly.</p>
      <button disabled class="px-4 py-2 bg-white/10 text-gray-400 rounded-lg text-sm font-medium cursor-not-allowed">
        Change Password
      </button>
    </div>

  </div>
</div>
