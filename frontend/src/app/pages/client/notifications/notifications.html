<section class="notifications-page"><header><div><p>LIVE ACTIVITY</p><h1>Notifications</h1><span>Appointments, high-interest signals and conversations requiring human attention.</span></div><label><input type="checkbox" [(ngModel)]="unreadOnly" (change)="load()"> Unread only</label></header>
  <p class="empty" *ngIf="loading">Loading notifications…</p><div class="feed" *ngIf="!loading"><button *ngFor="let item of items" (click)="open(item)" [class.unread]="!item.read_at"><i class="material-symbols-outlined">{{item.notification_type === 'human_intervention' ? 'support_agent' : item.notification_type.includes('appointment') ? 'event' : 'visibility'}}</i><span><small>{{item.notification_type.replaceAll('_',' ')}}</small><b>{{item.title}}</b><em>{{item.body}}</em><time>{{item.created_at | date:'medium'}}</time></span></button><p class="empty" *ngIf="!items.length">You are all caught up.</p></div>
</section>
