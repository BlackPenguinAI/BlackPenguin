<div class="fixed inset-0 z-0 pointer-events-none">
  <video #bgVideo [muted]="true" [autoplay]="true" [loop]="false" playsinline class="login-bg-video w-full h-full object-cover brightness-60" (loadedmetadata)="syncBackgroundVideoSegment()" (timeupdate)="keepBackgroundInSelectedSegment()">
    <source [src]="backgroundVideoSrc" type="video/mp4">
  </video>
</div>

<div class="min-h-screen flex items-center justify-center p-4 relative z-10 select-none">
  
  <div class="liquid-glass login-glass w-full max-w-md p-8 md:p-10 flex flex-col gap-6 shadow-2xl relative">
    
    <button routerLink="/" class="absolute top-4 left-4 transition-colors flex items-center gap-1 text-xs focus:outline-none">
      <span class="material-symbols-outlined text-sm">arrow_back</span>
    </button>
    
    <div class="text-center flex flex-col items-center gap-2 mt-2">
      <img alt="Black Penguin Logo" class="h-14 w-14 object-contain cursor-pointer transition-transform hover:scale-105" src="/BPicon.png" routerLink="/">
      <h2 class="text-2xl font-wordmark tracking-tighter mt-2 flex items-center justify-center">
        <span class="text-black font-semibold">Black</span><span class="text-secondary font-light">Penguin</span>
      </h2>
      <div class="login-copy">
        <p class="login-copy-title">{{ 'AUTH.SUBTITLE_LOGIN_TITLE' | translate }}</p>
        <p class="login-copy-detail">{{ 'AUTH.SUBTITLE_LOGIN_DESC' | translate }}</p>
      </div>
    </div>

    <form (ngSubmit)="handleLogin()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        <label for="login-email" class="login-field-label">{{ 'AUTH.EMAIL' | translate }}</label>
        <input 
          id="login-email"
          [(ngModel)]="credentials.email" name="email" type="email" required
          autocomplete="email"
          class="login-input w-full rounded-xl px-4 py-3 focus:outline-none transition-colors">
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="login-password" class="login-field-label">{{ 'AUTH.PASSWORD' | translate }}</label>
        <div class="password-input-wrap">
          <input
            id="login-password"
            [(ngModel)]="credentials.password" name="password" [type]="showPassword ? 'text' : 'password'" required
            autocomplete="current-password"
            class="login-input w-full rounded-xl px-4 py-3 pr-12 focus:outline-none transition-colors">
          <button
            type="button"
            class="password-visibility-button"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            (click)="togglePasswordVisibility()">
            <span class="material-symbols-outlined">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <div class="login-options-row flex items-center justify-between px-1 text-xs mt-1">
        <label class="remember-checkbox">
          <input type="checkbox" [(ngModel)]="rememberDevice" name="rememberDevice" [ngModelOptions]="{ standalone: true }">
          <span class="remember-checkbox-box" aria-hidden="true">
            <span class="material-symbols-outlined">check</span>
          </span>
          <span>{{ 'AUTH.REMEMBER_ME' | translate }}</span>
        </label>
        <a class="forgot-password-link cursor-pointer">{{ 'AUTH.FORGOT_PASSWORD' | translate }}</a>
      </div>

      <button 
        [disabled]="isSubmitting || !credentials.email || !credentials.password"
        type="submit" 
        class="liquid-sign-in-button w-full mt-4 flex items-center justify-center gap-2 disabled:opacity-40">
        <span *ngIf="isSubmitting" class="material-symbols-outlined animate-spin text-sm">sync</span>
        {{ 'AUTH.SIGN_IN' | translate }}
      </button>
    </form>

    
    <p class="login-demo-copy text-xs text-center mt-2">
      {{ 'AUTH.DONT_HAVE_ACCOUNT' | translate }} 
      <a routerLink="/" fragment="waitlist" class="request-demo-link">{{ 'AUTH.REQUEST_DEMO' | translate }}</a>
    </p>

  </div>
</div>
