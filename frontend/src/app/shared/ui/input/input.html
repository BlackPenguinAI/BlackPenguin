<div class="flex flex-col gap-1.5 w-full">
  <label *ngIf="label" class="text-[10px] uppercase tracking-widest text-gray-500 font-bold ml-1">
    {{ label }}
  </label>
  
  <div class="relative w-full">
    <span *ngIf="icon" class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-gray-400 text-[18px]">
      {{ icon }}
    </span>

    <input 
      [type]="isPasswordVisible ? 'text' : type"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [value]="value"
      (input)="onInput($event)"
      (blur)="onTouched()"
      [ngClass]="[
        'w-full bg-black/50 border border-white/10 focus:border-secondary rounded-xl py-3 text-sm text-white outline-none transition-colors disabled:opacity-50 disabled:cursor-not-allowed',
        icon ? 'pl-11 pr-4' : 'px-4',
        type === 'password' ? 'pr-11' : ''
      ]">

    <button *ngIf="type === 'password'" type="button" (click)="togglePassword()" 
            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors focus:outline-none">
      <span class="material-symbols-outlined text-[18px]">
        {{ isPasswordVisible ? 'visibility_off' : 'visibility' }}
      </span>
    </button>
  </div>
  
  <span *ngIf="error" class="text-[10px] text-red-400 mt-0.5 px-1">{{ error }}</span>
</div>
