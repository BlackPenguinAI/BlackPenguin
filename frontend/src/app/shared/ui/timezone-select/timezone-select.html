<ng-select
  class="timezone-select"
  [class.timezone-select--compact]="compact"
  [items]="options"
  bindLabel="label"
  bindValue="value"
  [searchFn]="searchTimezone"
  [virtualScroll]="true"
  [clearable]="false"
  [disabled]="disabled"
  [searchable]="true"
  [ngModel]="value"
  [ngModelOptions]="{ standalone: true }"
  (ngModelChange)="update($event)"
  placeholder="Search Lima, Bogotá, America/Lima or UTC-5"
  [attr.aria-label]="ariaLabel"
>
  <ng-template ng-label-tmp let-item="item">
    <span class="timezone-value" [title]="item.label">{{ item.summary }}</span>
  </ng-template>
  <ng-template ng-option-tmp let-item="item">
    <span class="timezone-option__summary">{{ item.summary }}</span>
    <span class="timezone-option__iana">{{ item.value }}</span>
  </ng-template>
</ng-select>
