<button 
  [type]="type"
  [disabled]="disabled || isLoading"
  (click)="onClick.emit($event)"
  [ngClass]="getButtonClasses()">
  
  <span *ngIf="isLoading" class="material-symbols-outlined animate-spin text-[18px]">sync</span>
  
  <span *ngIf="icon && !isLoading" class="material-symbols-outlined text-[18px]">{{ icon }}</span>
  
  <ng-content></ng-content>
</button>
