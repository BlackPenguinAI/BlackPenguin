<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 animate-fade-in">
  
  <div 
    class="bg-[#111111] rounded-3xl w-full flex flex-col relative animate-fade-in shadow-2xl border"
    [ngClass]="[
      maxWidthClass, 
      variant === 'danger' ? 'border-red-500/20 shadow-[0_0_50px_rgba(239,68,68,0.15)] text-center items-center' : 'border-white/10'
    ]">
    
    <button *ngIf="showCloseButton" (click)="close.emit()" class="absolute top-6 right-6 text-gray-500 hover:text-white transition-colors focus:outline-none z-10">
      <span class="material-symbols-outlined text-[24px]">close</span>
    </button>

    <div *ngIf="variant === 'danger'" class="w-20 h-20 bg-red-500/10 rounded-full flex items-center justify-center mb-5 mt-8 border border-red-500/20">
      <span class="material-symbols-outlined text-red-500 text-4xl">warning</span>
    </div>

    <div *ngIf="title" [ngClass]="variant === 'danger' ? 'mb-2' : 'mb-6 px-8 pt-8'">
      <h2 class="text-2xl font-light text-white">{{ title }}</h2>
      <p *ngIf="subtitle" class="text-sm text-gray-400 mt-1">{{ subtitle }}</p>
    </div>

    <div [ngClass]="variant === 'danger' ? 'px-8 pb-8 w-full' : 'px-8 pb-8'">
      <ng-content></ng-content>
    </div>

  </div>
</div>
