<section *ngIf="choices.length || question.allow_custom" class="question-options" aria-label="Suggested responses">
  <p *ngIf="showPrompt && !answered" class="question-prompt">{{ question.prompt }}</p>
  <div class="choice-list" [class.choice-list--examples]="!question.options.length">
    <button
      *ngFor="let choice of choices"
      type="button"
      class="choice"
      [class.choice--selected]="choice === selectedChoice"
      [disabled]="disabled"
      (click)="selected.emit(choice)"
    >
      <span *ngIf="choice === selectedChoice" class="material-symbols-outlined">check</span>{{ choice }}
    </button>
    <button
      *ngIf="question.allow_custom"
      type="button"
      class="choice choice--custom"
      [disabled]="disabled"
      (click)="custom.emit()"
    >
      Other / write my own
    </button>
  </div>
  <p *ngIf="question.minimum_words" class="hint">Use at least {{ question.minimum_words }} words for a complete answer.</p>
  <p *ngIf="question.minimum_characters" class="hint">Use at least {{ question.minimum_characters }} characters for a complete answer.</p>
</section>
