<div class="app-shell">
  
  <aside class="control-sidebar">
    
    <div class="control-sidebar-brand">
      <div class="control-sidebar-logo-row">
        <img alt="Black Penguin Logo" src="/BPicon.png" class="control-sidebar-logo">
      </div>
      <span class="control-sidebar-kicker">
        {{ userRole === 'superadmin' ? 'Master Control Center' : 'Tenant Workspace' }}
      </span>
    </div>

    <nav *ngIf="userRole === 'superadmin'" class="control-sidebar-nav scrollbar-hide">
      
      <a routerLink="/admin/dashboard" routerLinkActive="is-active" [routerLinkActiveOptions]="{exact: true}" class="control-sidebar-link">
        Dashboard
      </a>
      
      <a routerLink="/admin/profile" routerLinkActive="is-active" class="control-sidebar-link">
        My Profile
      </a>

      <a routerLink="/admin/companies" routerLinkActive="is-active" class="control-sidebar-link module-start">
        Companies
      </a>

      <a routerLink="/admin/users" routerLinkActive="is-active" class="control-sidebar-link">
        Users
      </a>

      <a routerLink="/admin/waitlist" routerLinkActive="is-active" class="control-sidebar-link">
        Waitlist
      </a>

      <a routerLink="/admin/plans" routerLinkActive="is-active" class="control-sidebar-link">
        Plans
      </a>

      <a routerLink="/admin/ai-infrastructure" routerLinkActive="is-active" class="control-sidebar-link module-start">
        AI Infrastructure
      </a>

      <a routerLink="/admin/ai-settings" routerLinkActive="is-active" class="control-sidebar-link">
        AI Settings
      </a>

      <a routerLink="/admin/email-settings" routerLinkActive="is-active" class="control-sidebar-link">
        Email Settings
      </a>

      <a routerLink="/admin/messaging-settings" routerLinkActive="is-active" class="control-sidebar-link">
        Messaging Settings
      </a>
    </nav>

    <nav *ngIf="userRole !== 'superadmin'" class="control-sidebar-nav scrollbar-hide">
      <a routerLink="/app/dashboard" routerLinkActive="is-active" [routerLinkActiveOptions]="{exact: true}" class="control-sidebar-link">
        Dashboard
      </a>

      <a routerLink="/app/company" routerLinkActive="is-active" class="control-sidebar-link">
        Company Onboarding
      </a>

      <a routerLink="/app/projects" routerLinkActive="is-active" class="control-sidebar-link">
        Projects
      </a>

      <a routerLink="/app/profile" routerLinkActive="is-active" class="control-sidebar-link">
        My Profile
      </a>
    </nav>

    <div class="control-sidebar-footer">
      <button (click)="logout()" class="control-logout-button" aria-label="Logout">
        <img alt="" src="/logout-2-svgrepo-com.svg">
      </button>
    </div>

  </aside>

  <main class="app-content">
    <div class="gravity-stars-bg" aria-hidden="true"></div>

    <div class="profile-menu">
      <button class="profile-menu-trigger" type="button" aria-label="Logged in user">
        <img *ngIf="profileImageUrl; else profileInitials" [src]="profileImageUrl" alt="">
        <ng-template #profileInitials>{{ userInitials }}</ng-template>
      </button>
      <div class="profile-menu-card">
        <p class="profile-menu-name">{{ displayName }}</p>
        <p class="profile-menu-email">{{ userEmail }}</p>
        <a [routerLink]="profileRoute" class="profile-menu-link">Profile</a>
      </div>
    </div>

    <router-outlet></router-outlet>
  </main>

</div>
