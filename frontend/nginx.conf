# Conserva el protocolo original cuando HTTPS termina en Cloudflare u otro
# proxy anterior. Para acceso directo, usa el protocolo visto por Nginx.
map $http_x_forwarded_proto $bp_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name localhost;
    
    # 🚀 LA SOLUCIÓN AL ERROR 413: Permitir subidas de hasta 50 Megabytes
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # El shell HTML nunca debe quedar cacheado entre despliegues.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location ~ ^/(?:app|admin|login|register|set-password)(?:/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    # Los assets versionados por hash pueden conservarse de forma segura.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # 1. Rutas de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. 🚀 PUENTE AL BACKEND (Proxy Inverso)
    location /api/ {
        # Pasamos la petición internamente al puerto 8000
        proxy_pass http://206.189.118.99:8000;
        
        # Mantenemos los datos originales del cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bp_forwarded_proto;
    }
}
